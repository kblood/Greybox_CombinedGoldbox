# Scoped config for the Greybox web app at https://dionysus.dk/greybox/.
# (Project name = Greybox. Renamed from /goldbox/ on 2026-06-21.)
#
# The site lives at the document-root level (/var/www/html/greybox/), not under
# /webxr/. The parent vhost ships AllowOverride None, so without this snippet the
# uploaded .htaccess (cache-control headers) would be silently ignored. We grant
# only FileInfo (enough for the Header directive) and turn off directory listing
# here in server context so the bundled game-asset tree isn't browsable.
#
# The 301 keeps old /goldbox/ links working after the rename.
#
# Install: sudo cp greybox.conf /etc/apache2/conf-available/ && sudo a2enconf greybox
#          && sudo apache2ctl configtest && sudo systemctl reload apache2
RedirectMatch 301 ^/goldbox(/.*)?$ /greybox$1

<Directory /var/www/html/greybox/>
    AllowOverride FileInfo
    Options -Indexes
</Directory>
