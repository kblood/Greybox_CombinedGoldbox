<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./dragon.svg" />
    <title>Greybox — Gold Box Engine</title>
    <link rel="stylesheet" href="/src/ui/viewer.css" />
  </head>
  <body>
    <header id="topbar">
      <h1><img src="./dragon.svg" alt="" class="brand-icon" width="22" height="22" />Greybox <span class="brand-sub">Gold Box Engine</span></h1>
      <div class="controls">
        <label class="zoom-control">
          Zoom
          <input id="zoom" type="range" min="1" max="8" step="1" value="3" />
          <span id="zoom-label">3×</span>
        </label>
        <label class="file-control">
          <input id="file-input" type="file" accept=".dax,.daa,.tlb,.glb,.lbm,.DAX,.DAA,.TLB,.GLB,.LBM" hidden />
          <button type="button" onclick="document.getElementById('file-input').click()">Open file…</button>
        </label>
      </div>
    </header>

    <div id="layout">
      <aside id="sidebar">
        <section id="library-section">
          <h2>Game Library</h2>
          <button id="add-folder-btn" type="button" class="primary-btn">+ Add asset folder reference</button>
          <input id="folder-input" type="file" webkitdirectory directory multiple hidden />
          <button id="import-module-btn" type="button" class="primary-btn">+ Import authored module…</button>
          <input id="module-input" type="file" accept=".gbmod,application/json" hidden />
          <div id="library-note" class="note small muted">Point at one of your own game installs to auto-detect it, or import a .gbmod module.</div>
          <div id="library-list"></div>
        </section>
        <div id="drop-zone">
          <strong>Drop a .DAX / .DAA / .TLB / .GLB / .LBM file here</strong>
          <span class="muted">or click to browse</span>
        </div>
        <h2>Games</h2>
        <div id="games"></div>
        <details class="sb-group" id="catalog-group">
          <summary class="sb-summary">Single assets (dev only)</summary>
          <div id="catalog"></div>
        </details>
      </aside>

      <main id="main">
        <div id="status" class="status">Loading…</div>
        <div id="output"></div>
      </main>
    </div>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
