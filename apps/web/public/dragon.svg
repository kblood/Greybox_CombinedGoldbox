<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Greybox dragon">
  <defs>
    <linearGradient id="scale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2bb5e"/>
      <stop offset="1" stop-color="#c47f29"/>
    </linearGradient>
  </defs>
  <!-- rounded tile background, matching the app theme -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="#14161c"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11.5" fill="none" stroke="#333a4a" stroke-width="1.5"/>

  <g stroke="#6e4413" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- back-swept horns (drawn first, head overlaps their base) -->
    <path d="M40 16 L60 4 L49 21 Z" fill="#d79a3c"/>
    <path d="M43 22 L58 20 L47 29 Z" fill="#c98c33"/>
    <!-- neck frill spikes -->
    <path d="M47 30 L55 31 L47 35 Z" fill="#c98c33"/>
    <path d="M47 36 L54 39 L46 40 Z" fill="#c98c33"/>

    <!-- lower jaw -->
    <path d="M24 39 C 28 47 39 48 45 43 C 41 41 32 40 26 38 Z" fill="#a86a22"/>

    <!-- head + upper jaw (profile, roaring left) -->
    <path d="M45 14
             C 39 12 33 14 29 18
             C 21 23 12 28 5 33
             L 11 36
             C 17 35 23 36 28 38
             L 43 37
             C 50 34 51 23 45 14 Z" fill="url(#scale)"/>
  </g>

  <!-- upper teeth -->
  <g fill="#f6e8c6" stroke="none">
    <path d="M12 35.5 l3.4 0 -1.7 3.4 z"/>
    <path d="M19 36.5 l3.2 0 -1.6 3.2 z"/>
    <path d="M26 37 l3 0 -1.5 3 z"/>
  </g>

  <!-- eye with a reptilian slit pupil -->
  <ellipse cx="34" cy="24" rx="3" ry="2.4" fill="#fbeec8"/>
  <path d="M34 21.6 C 35 23 35 25 34 26.4 C 33 25 33 23 34 21.6 Z" fill="#15110a"/>
  <!-- nostril -->
  <circle cx="9" cy="33" r="1.3" fill="#5e3c12"/>
</svg>
